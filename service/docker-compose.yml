services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ncpc
      POSTGRES_USER: ncpc
      POSTGRES_PASSWORD: ncpc
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ncpc -d ncpc"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - ncpc-postgres-data:/var/lib/postgresql/data

  ncpc:
    build: .
    environment:
      NCPC_DATABASE_URL: postgresql+psycopg://ncpc:ncpc@postgres:5432/ncpc
      NCPC_ENVIRONMENT: development
      NCPC_ADMIN_BOOTSTRAP_TOKEN: ${NCPC_ADMIN_BOOTSTRAP_TOKEN:?set NCPC_ADMIN_BOOTSTRAP_TOKEN}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn ncpc_service.api:app --host 0.0.0.0 --port 8080"]

volumes:
  ncpc-postgres-data:
