services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ncpc_proof
      POSTGRES_USER: ncpc_proof
      POSTGRES_PASSWORD: ncpc_proof_local_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ncpc_proof -d ncpc_proof"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes: ["ncpc-proof-data:/var/lib/postgresql/data"]
  ncpc:
    build: .
    environment:
      NCPC_DATABASE_URL: postgresql+psycopg://ncpc_proof:ncpc_proof_local_only@postgres:5432/ncpc_proof
      NCPC_ENVIRONMENT: development
      NCPC_ADMIN_BOOTSTRAP_TOKEN: ncpc-proof-bootstrap-token-local-only
    depends_on:
      postgres: {condition: service_healthy}
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn ncpc_service.api:app --host 0.0.0.0 --port 8080"]
volumes:
  ncpc-proof-data:

networks:
  default:
    ipam:
      config:
        # Explicit isolated proof range: Docker's automatic pools are exhausted on this host.
        - subnet: ${NCPC_PROOF_SUBNET:-172.16.242.0/24}
