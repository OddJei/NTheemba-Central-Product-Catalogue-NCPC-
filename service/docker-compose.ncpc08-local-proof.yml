services:
  ncpc:
    image: ncpc08-auth-ncpc:local
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile.ncpc08-local-proof
    environment:
      PYTHONPATH: /app/src
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/health').read()"]
      interval: 2s
      timeout: 10s
      retries: 30
      start_period: 10s
