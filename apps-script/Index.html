<!doctype html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ntheemba Central Product Catalogue</title>
  <style>
    :root{
      --navy:#071a33;--navy2:#0d2d4d;--emerald:#188865;--emerald2:#42bd91;
      --gold:#d6a13e;--paper:#fffdf7;--bg:#eef2f5;--ink:#151b25;--muted:#667085;
      --line:#d9e0e8;--danger:#c93030;--warning:#a56b00;--info:#235ea8;
      --shadow:0 14px 40px rgba(7,26,51,.09);--radius:14px
    }
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font:14px/1.48 Inter,Arial,sans-serif;background:var(--bg);color:var(--ink)}
    button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
    .app{min-height:100vh;display:grid;grid-template-columns:250px minmax(0,1fr)}
    .sidebar{position:sticky;top:0;height:100vh;padding:20px 14px;background:linear-gradient(180deg,#020710,var(--navy));color:#e7f2ef;overflow:auto}
    .brand{display:flex;gap:11px;align-items:center;padding:4px 8px 23px}.brand-mark{width:39px;height:39px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(135deg,var(--gold),var(--emerald2));font-weight:900;color:var(--navy)}
    .brand b{font-size:17px;display:block;color:white}.brand small{color:#9db3b0}.nav-label{padding:12px 10px 5px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#77908c}
    .nav-btn{width:100%;border:0;background:transparent;color:#d9e4e2;padding:10px 11px;margin:2px 0;border-radius:10px;text-align:left;display:flex;gap:9px;align-items:center}
    .nav-btn:hover,.nav-btn.active{background:rgba(66,189,145,.17);color:#fff}.nav-icon{width:20px;text-align:center}
    .sidebar-foot{margin-top:25px;padding:12px;border:1px solid rgba(255,255,255,.1);border-radius:11px;color:#9eb1b8;font-size:12px}
    .shell{min-width:0}.topbar{height:70px;position:sticky;top:0;z-index:20;background:rgba(255,253,247,.95);backdrop-filter:blur(9px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;gap:14px}
    .global-search{max-width:520px;flex:1;position:relative}.global-search input{padding-left:38px}.global-search span{position:absolute;left:13px;top:10px;color:var(--muted)}
    .top-actions{display:flex;gap:8px;align-items:center}.content{max-width:1520px;margin:auto;padding:26px}.view{display:none}.view.active{display:block}
    h1{font-size:25px;color:var(--navy);margin:0 0 3px}h2{font-size:18px;color:var(--navy);margin:0 0 13px}h3{font-size:15px;margin:0 0 10px;color:var(--navy)}
    .sub{color:var(--muted);margin:0 0 19px}.section-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:18px}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    button{border:0;border-radius:9px;background:var(--emerald);color:#fff;padding:9px 13px;font-weight:650}button:hover{filter:brightness(.96)}button.secondary{background:#fff;color:var(--navy);border:1px solid var(--line)}button.ghost{background:transparent;color:var(--navy)}button.danger{background:var(--danger)}button.warning{background:var(--warning)}button:disabled{opacity:.45;cursor:not-allowed}
    input,select,textarea{width:100%;border:1px solid #ccd5df;border-radius:9px;background:#fff;color:var(--ink);padding:10px 11px}textarea{min-height:104px;resize:vertical}input:focus,select:focus,textarea:focus{outline:0;border-color:var(--emerald);box-shadow:0 0 0 3px rgba(24,136,101,.14)}
    label{display:block;font-weight:700;color:#344054}label small{display:block;font-weight:400;color:var(--muted);margin-bottom:5px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.form-grid .full{grid-column:1/-1}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.card,.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.card{padding:17px}.panel{padding:18px;margin-top:17px}
    .metric b{display:block;font-size:27px;color:var(--emerald);line-height:1.2}.metric span{color:var(--muted)}.metric small{display:block;margin-top:6px;color:#98a2b3}
    .split{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(280px,.75fr);gap:17px}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:13px}.filters{display:grid;grid-template-columns:repeat(6,minmax(120px,1fr));gap:8px;margin:11px 0}
    .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:11px}table{border-collapse:collapse;width:100%;background:white}th,td{padding:10px 11px;border-bottom:1px solid #e6ebf0;text-align:left;white-space:nowrap;vertical-align:top}th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#667085;background:#f7f9fb;position:sticky;top:0}tr:last-child td{border-bottom:0}tbody tr:hover{background:#f8fcfa}.wrap{white-space:normal;min-width:230px}.empty{text-align:center;padding:32px;color:var(--muted)}
    .badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:99px;background:#edf2f7;color:#344054;font-size:11px;font-weight:700}.badge.good{background:#dcf6e8;color:#12613f}.badge.warn{background:#fff0c9;color:#7c5000}.badge.bad{background:#fde3e3;color:#9f2222}.badge.info{background:#deebff;color:#194e8f}
    .progress{height:10px;border-radius:99px;background:#e5e9ef;overflow:hidden}.progress>span{display:block;height:100%;background:linear-gradient(90deg,var(--emerald),var(--emerald2));transition:width .2s}.progress-label{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:5px}
    .tabs{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 15px}.tabs button{background:#eef2f5;color:var(--navy)}.tabs button.active{background:var(--navy);color:white}
    .detail-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.detail-item{border:1px solid var(--line);border-radius:10px;padding:11px;background:#fff}.detail-item small{display:block;color:var(--muted);margin-bottom:3px}.detail-item b{word-break:break-word}
    .variant{border:1px solid var(--line);border-radius:11px;margin:10px 0;background:#fff}.variant-head{display:flex;justify-content:space-between;gap:10px;padding:12px}.variant-body{border-top:1px solid var(--line);padding:12px;background:#fafcfb}
    .dropzone{border:2px dashed #b8c4d1;border-radius:13px;padding:28px;text-align:center;background:#fbfcfd}.dropzone.drag{border-color:var(--emerald);background:#eefaf5}.dropzone input{max-width:440px;margin:12px auto 0}.manifest-preview{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:9px;margin-top:15px}.preview-item{padding:12px;border:1px solid var(--line);border-radius:10px;background:white}.preview-item b{display:block;font-size:20px;color:var(--navy)}
    .import-job{padding:14px;border:1px solid var(--line);border-radius:12px;background:#fff;margin:9px 0}.import-job-head{display:flex;justify-content:space-between;gap:12px}.job-stats{display:flex;gap:13px;flex-wrap:wrap;margin:9px 0;color:var(--muted);font-size:12px}
    .modal-backdrop{position:fixed;inset:0;background:rgba(6,17,32,.66);display:none;align-items:center;justify-content:center;padding:18px;z-index:60}.modal-backdrop.open{display:flex}.modal{background:var(--paper);width:min(970px,100%);max-height:92vh;overflow:auto;border-radius:16px;box-shadow:0 24px 80px rgba(0,0,0,.3)}.modal-head{position:sticky;top:0;background:var(--paper);z-index:2;padding:17px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:15px;align-items:center}.modal-body{padding:20px}.modal-foot{position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:13px 20px;display:flex;justify-content:flex-end;gap:8px}
    .toast{position:fixed;right:20px;bottom:20px;z-index:100;background:var(--navy);color:#fff;padding:12px 16px;border-radius:10px;box-shadow:var(--shadow);display:none;max-width:420px}.toast.show{display:block}.toast.error{background:var(--danger)}
    .busy{position:fixed;inset:0;background:rgba(255,255,255,.45);z-index:90;display:none;align-items:center;justify-content:center}.busy.show{display:flex}.spinner{width:42px;height:42px;border:4px solid #d9e4e0;border-top-color:var(--emerald);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    .mobile-nav{display:none}.notice{padding:12px 14px;border-radius:10px;background:#e9f3ff;color:#194e8f;border:1px solid #c7dcf7}.notice.warn{background:#fff6dc;color:#714a00;border-color:#ecd695}.notice.good{background:#e8f8ef;color:#165d3e;border-color:#c9ebd8}.code{font:12px/1.5 Consolas,monospace;white-space:pre-wrap;word-break:break-word;background:#081b32;color:#e7f3ee;border-radius:10px;padding:13px;max-height:360px;overflow:auto}
    @media(max-width:1100px){.filters{grid-template-columns:repeat(3,1fr)}.split{grid-template-columns:1fr}.detail-grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:780px){.app{display:block}.sidebar{display:none}.topbar{padding:0 12px;height:auto;min-height:64px;flex-wrap:wrap}.global-search{order:2;flex-basis:100%;padding-bottom:9px}.content{padding:17px}.mobile-nav{display:flex;position:sticky;top:0;z-index:30;background:var(--navy);overflow:auto;padding:7px;gap:5px}.mobile-nav button{white-space:nowrap;background:transparent}.mobile-nav button.active{background:rgba(66,189,145,.2)}.filters{grid-template-columns:1fr 1fr}.form-grid,.detail-grid{grid-template-columns:1fr}.section-head,.toolbar{align-items:stretch;flex-direction:column}.top-actions .secondary{display:none}}
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">NC</div><div><b>Ntheemba</b><small>Central Product Catalogue</small></div></div>
    <div id="desktopNav"></div>
    <div class="sidebar-foot"><b>Standalone catalogue</b><br>No TradeFlow or Ntheemba Bot connection is enabled in this version.</div>
  </aside>
  <main class="shell">
    <div class="mobile-nav" id="mobileNav"></div>
    <header class="topbar">
      <div class="global-search"><span>⌕</span><input id="globalSearch" placeholder="Search product, alias, variant or barcode…"></div>
      <div class="top-actions"><span id="versionBadge" class="badge info">Loading…</span><button class="secondary" onclick="openDatabase()">Database</button><button onclick="openProductEditor()">+ Product</button></div>
    </header>
    <div class="content">
      <section id="dashboard" class="view active"></section>
      <section id="catalogue" class="view"></section>
      <section id="reviews" class="view"></section>
      <section id="barcodes" class="view"></section>
      <section id="imports" class="view"></section>
      <section id="organizations" class="view"></section>
      <section id="references" class="view"></section>
      <section id="evidence" class="view"></section>
      <section id="releases" class="view"></section>
      <section id="audit" class="view"></section>
      <section id="settings" class="view"></section>
    </div>
  </main>
</div>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal"><div class="modal-head"><h2 id="modalTitle">Dialog</h2><button class="secondary" onclick="closeModal()">Close</button></div><div class="modal-body" id="modalBody"></div><div class="modal-foot" id="modalFoot"></div></div></div>
<div class="toast" id="toast"></div><div class="busy" id="busy"><div class="spinner"></div></div>
<script>
const state={
  active:'dashboard',bootstrap:null,reference:{},catalogue:{query:'',filters:{},page:1,pageSize:25},
  manifest:null,manifestFileName:'',currentImportJob:null,importRunning:false,referenceTab:'CatalogueDomains',evidenceTab:'InformationSources'
};
const NAV=[
  ['WORKSPACE'],['dashboard','Dashboard','⌂'],['catalogue','Product Catalogue','▦'],['reviews','Review Queue','✓'],['barcodes','Barcode Verification','▥'],['imports','Import Management','⇩'],
  ['CATALOGUE GOVERNANCE'],['organizations','Organizations','◎'],['references','Reference Data','⌘'],['evidence','Sources & Evidence','◉'],['releases','Catalogue Releases','◆'],
  ['ADMINISTRATION'],['audit','Audit Trail','≡'],['settings','System Administration','⚙']
];

function server(name,...args){
  setBusy(true);
  return new Promise((resolve,reject)=>{
    if(!window.google||!google.script||!google.script.run){setBusy(false);reject(new Error('This interface must run from a deployed Google Apps Script web app.'));return;}
    google.script.run.withSuccessHandler(result=>{
      setBusy(false);
      if(!result||!result.success){const error=new Error(result?.message||'Request failed');error.code=result?.errorCode;reject(error);return;}
      versionBadge.textContent='Catalogue v'+result.catalogueVersion;
      resolve(result.data);
    }).withFailureHandler(error=>{setBusy(false);reject(new Error(error?.message||'Server error'));})[name](...args);
  });
}
function setBusy(value){busy.classList.toggle('show',!!value)}
function notify(message,error=false){toast.textContent=message;toast.className='toast show'+(error?' error':'');clearTimeout(notify.timer);notify.timer=setTimeout(()=>toast.className='toast',3600)}
function escapeHtml(value){return String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function label(value){return String(value||'').replace(/_/g,' ').replace(/([a-z])([A-Z])/g,'$1 $2').replace(/^./,c=>c.toUpperCase())}
function dateText(value){if(!value)return '—';const d=new Date(value);return Number.isNaN(d.getTime())?escapeHtml(value):d.toLocaleString()}
function badge(value){const text=String(value||'unspecified');const lower=text.toLowerCase();let type='';if(['active','verified','published','completed','resolved','approved','promoted'].includes(lower))type='good';else if(['pending','draft','in_review','reviewed','processing','queued','receiving','paused','waiting_for_information'].includes(lower))type='warn';else if(['rejected','failed','cancelled','inactive','withdrawn','disputed','completed_with_errors'].includes(lower))type='bad';else type='info';return `<span class="badge ${type}">${escapeHtml(label(text))}</span>`}
function table(columns,rows,actionRenderer){if(!rows?.length)return '<div class="empty">No records found.</div>';return `<div class="table-wrap"><table><thead><tr>${columns.map(c=>`<th>${escapeHtml(label(c))}</th>`).join('')}${actionRenderer?'<th>Actions</th>':''}</tr></thead><tbody>${rows.map(row=>`<tr>${columns.map(c=>`<td class="${['canonicalName','description','reason','title','legalName','notes'].includes(c)?'wrap':''}">${renderCell(row[c],c)}</td>`).join('')}${actionRenderer?`<td>${actionRenderer(row)}</td>`:''}</tr>`).join('')}</tbody></table></div>`}
function renderCell(value,key){if(['status','verificationStatus','publicationStatus','qualityTier','priority','authority','evidenceTier','action'].includes(key))return badge(value);if(key.toLowerCase().includes('at')||key.toLowerCase().includes('date'))return dateText(value);if(typeof value==='boolean')return value?'Yes':'No';if(key==='url'&&value)return `<a href="${escapeHtml(value)}" target="_blank">Open source</a>`;return escapeHtml(value??'')}
function options(rows,value,textField='name',placeholder='Select…'){return `<option value="">${placeholder}</option>`+(rows||[]).map(row=>`<option value="${escapeHtml(row.id)}" ${String(row.id)===String(value)?'selected':''}>${escapeHtml(row[textField]||row.name||row.id)}</option>`).join('')}
function selectOptions(values,current,placeholder='Select…'){return `<option value="">${placeholder}</option>`+values.map(v=>`<option value="${escapeHtml(v)}" ${String(v)===String(current)?'selected':''}>${escapeHtml(label(v))}</option>`).join('')}

function buildNav(){
  let html='';NAV.forEach(item=>{if(item.length===1)html+=`<div class="nav-label">${item[0]}</div>`;else html+=`<button class="nav-btn ${state.active===item[0]?'active':''}" onclick="navigate('${item[0]}')"><span class="nav-icon">${item[2]}</span>${item[1]}</button>`});desktopNav.innerHTML=html;
  mobileNav.innerHTML=NAV.filter(x=>x.length>1).map(item=>`<button class="${state.active===item[0]?'active':''}" onclick="navigate('${item[0]}')">${item[1]}</button>`).join('');
}
async function navigate(view){state.active=view;document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById(view).classList.add('active');buildNav();try{await renderActive()}catch(e){notify(e.message,true)}}
async function renderActive(){if(state.active==='dashboard')return renderDashboard();if(state.active==='catalogue')return renderCatalogue();if(state.active==='reviews')return renderReviews();if(state.active==='barcodes')return renderBarcodes();if(state.active==='imports')return renderImports();if(state.active==='organizations')return renderOrganizations();if(state.active==='references')return renderReferences();if(state.active==='evidence')return renderEvidence();if(state.active==='releases')return renderReleases();if(state.active==='audit')return renderAudit();if(state.active==='settings')return renderSettings()}
async function refreshBootstrap(){state.bootstrap=await server('getNcpcBootstrap');state.reference=state.bootstrap.referenceData;versionBadge.textContent='Catalogue v'+state.bootstrap.dashboard.metrics.catalogueVersion}
async function refreshReference(){state.reference=await server('getNcpcReferenceData')}
function openDatabase(){const url=state.bootstrap?.database?.url;if(url)window.open(url,'_blank');else notify('Database URL is not available.',true)}

async function renderDashboard(){const data=await server('getNcpcDashboard');state.bootstrap.dashboard=data;const m=data.metrics;dashboard.innerHTML=`<div class="section-head"><div><h1>Catalogue Governance Dashboard</h1><p class="sub">A standalone shared product-identity system with controlled evidence, review and publication.</p></div><div class="actions"><button class="secondary" onclick="navigate('imports')">Import catalogue</button><button onclick="openProductEditor()">Add product</button></div></div><div class="grid">${[
['Products',m.products,'All catalogue records'],['Published',m.publishedProducts,'Available in releases'],['Draft products',m.draftProducts,'Awaiting review'],['Variants',m.variants,'Sellable product forms'],['Identifiers',m.identifiers,'Barcodes and IDs'],['Organizations',m.organizations,'Commercial entities'],['Pending reviews',m.pendingReviews,'Governance decisions'],['Barcode reviews',m.pendingBarcodes,'Identifiers awaiting proof']
].map(x=>`<div class="card metric"><b>${x[1]}</b><span>${x[0]}</span><small>${x[2]}</small></div>`).join('')}</div><div class="split"><div><div class="panel"><div class="toolbar"><h2>Recently updated products</h2><button class="secondary" onclick="navigate('catalogue')">Open catalogue</button></div>${table(['canonicalName','qualityTier','verificationStatus','publicationStatus','updatedAt'],data.recentProducts,row=>`<button class="secondary" onclick="openProduct('${row.id}')">Open</button>`)}</div><div class="panel"><h2>Recent imports</h2>${renderImportJobs(data.recentImports)}</div></div><div><div class="panel"><h2>Quality tiers</h2>${distribution(data.qualityTiers)}</div><div class="panel"><h2>Publication status</h2>${distribution(data.publicationStatuses)}</div><div class="panel"><h2>Open review types</h2>${distribution(data.reviewTypes)}</div></div></div>`}
function distribution(data){const entries=Object.entries(data||{});if(!entries.length)return '<div class="empty">No data yet.</div>';const total=entries.reduce((s,x)=>s+x[1],0)||1;return entries.sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div style="margin:11px 0"><div class="progress-label"><span>${escapeHtml(label(k))}</span><b>${v}</b></div><div class="progress"><span style="width:${Math.round(v/total*100)}%"></span></div></div>`).join('')}

async function renderCatalogue(){await refreshReference();const f=state.catalogue.filters;const data=await server('searchNcpcCatalogue',state.catalogue.query,f,state.catalogue.page,state.catalogue.pageSize);const categories=(state.reference.categories||[]).filter(x=>!f.catalogueDomainId||x.catalogueDomainId===f.catalogueDomainId);catalogue.innerHTML=`<div class="section-head"><div><h1>Product Catalogue</h1><p class="sub">Canonical products, variants, identifiers, aliases, organizations and evidence.</p></div><div class="actions"><button class="secondary" onclick="downloadCatalogue(false)">Export all</button><button onclick="openProductEditor()">+ Product</button></div></div><div class="panel"><input id="catalogueSearch" value="${escapeHtml(state.catalogue.query)}" placeholder="Search names, aliases, variants or barcode…" oninput="queueCatalogueSearch(this.value)"><div class="filters"><select onchange="setCatalogueFilter('catalogueDomainId',this.value)">${options(state.reference.catalogueDomains,f.catalogueDomainId,'name','All domains')}</select><select onchange="setCatalogueFilter('categoryId',this.value)">${options(categories,f.categoryId,'name','All categories')}</select><select onchange="setCatalogueFilter('brandId',this.value)">${options(state.reference.brands,f.brandId,'name','All brands')}</select><select onchange="setCatalogueFilter('verificationStatus',this.value)">${selectOptions(state.bootstrap.enums.verificationStatuses,f.verificationStatus,'All verification')}</select><select onchange="setCatalogueFilter('publicationStatus',this.value)">${selectOptions(state.bootstrap.enums.publicationStatuses,f.publicationStatus,'All publication')}</select><select onchange="setCatalogueFilter('qualityTier',this.value)">${selectOptions(state.bootstrap.enums.evidenceTiers.concat(['manually_created']),f.qualityTier,'All quality tiers')}</select></div><div class="toolbar"><span class="sub">${data.total} product${data.total===1?'':'s'} found</span><button class="secondary" onclick="clearCatalogueFilters()">Clear filters</button></div>${table(['canonicalName','brandName','categoryName','variantCount','identifierCount','qualityTier','verificationStatus','publicationStatus','updatedAt'],data.records,row=>`<button class="secondary" onclick="openProduct('${row.id}')">Open</button>`)}</div>${pager(data)}`}
let catalogueSearchTimer;function queueCatalogueSearch(value){clearTimeout(catalogueSearchTimer);catalogueSearchTimer=setTimeout(()=>{state.catalogue.query=value;state.catalogue.page=1;renderCatalogue().catch(e=>notify(e.message,true))},250)}
function setCatalogueFilter(key,value){state.catalogue.filters[key]=value;if(key==='catalogueDomainId')state.catalogue.filters.categoryId='';state.catalogue.page=1;renderCatalogue().catch(e=>notify(e.message,true))}
function clearCatalogueFilters(){state.catalogue.query='';state.catalogue.filters={};state.catalogue.page=1;renderCatalogue().catch(e=>notify(e.message,true))}
function pager(data){const pages=Math.max(1,Math.ceil(data.total/data.pageSize));return `<div class="toolbar" style="margin-top:12px"><select style="width:100px" onchange="state.catalogue.pageSize=Number(this.value);state.catalogue.page=1;renderCatalogue()"><option ${data.pageSize===25?'selected':''}>25</option><option ${data.pageSize===50?'selected':''}>50</option><option ${data.pageSize===100?'selected':''}>100</option></select><div class="actions"><button class="secondary" ${data.page<=1?'disabled':''} onclick="state.catalogue.page--;renderCatalogue()">Previous</button><span>Page ${data.page} of ${pages}</span><button class="secondary" ${data.page>=pages?'disabled':''} onclick="state.catalogue.page++;renderCatalogue()">Next</button></div></div>`}

async function openProduct(productId){const data=await server('getNcpcProduct',productId);const p=data.product;const domain=state.reference.catalogueDomains.find(x=>x.id===p.catalogueDomainId);const category=state.reference.categories.find(x=>x.id===p.categoryId);const brand=state.reference.brands.find(x=>x.id===p.brandId);openModal(p.canonicalName,`<div class="actions" style="margin-bottom:15px"><button onclick="closeModal();openProductEditor('${p.id}')">Edit product</button><button class="secondary" onclick="publishProduct('${p.id}')">Publish</button><button class="secondary" onclick="withdrawProduct('${p.id}')">Withdraw</button><button class="secondary" onclick="openEvidenceEditor('${p.id}')">Add evidence</button><button class="secondary" onclick="openProductRelationshipEditor('${p.id}')">Link organization</button><button class="secondary" onclick="openDigitalAssetEditor('${p.id}')">Add digital asset</button></div><div class="detail-grid">${detail('Product ID',p.id)}${detail('Domain',domain?.name)}${detail('Category',category?.name)}${detail('Brand',brand?.name)}${detail('Quality tier',badge(p.qualityTier),true)}${detail('Verification',badge(p.verificationStatus),true)}${detail('Publication',badge(p.publicationStatus),true)}${detail('Status',badge(p.status),true)}${detail('Version',p.version)}</div><div class="panel"><h3>Description</h3><p>${escapeHtml(p.description||'No description')}</p></div><div class="panel"><h3>Aliases</h3>${data.aliases.length?data.aliases.map(a=>`<span class="badge info" style="margin:3px">${escapeHtml(a.alias)}</span>`).join(''):'<div class="empty">No aliases</div>'}</div><div class="panel"><h3>Product variants</h3>${data.variants.length?data.variants.map(renderVariant).join(''):'<div class="empty">No variants</div>'}</div><div class="panel"><h3>Organization relationships</h3>${table(['organizationName','relationshipType','territoryCode','verificationStatus'],data.organizationRelationships)}</div><div class="panel"><h3>Digital assets</h3>${table(['assetType','sourceUrl','caption','verificationStatus','status'],data.digitalAssets)}</div><div class="panel"><h3>Catalogue evidence</h3>${table(['claimType','claimValue','evidenceTier','confidence','verificationStatus','sourceTitle'],data.evidence)}</div>`,``)}
function detail(name,value,raw=false){return `<div class="detail-item"><small>${escapeHtml(name)}</small><b>${raw?value:escapeHtml(value||'—')}</b></div>`}
function renderVariant(v){return `<div class="variant"><div class="variant-head"><div><b>${escapeHtml(v.variantName)}</b><br><small>${escapeHtml([v.sizeValue,v.sizeUnit,v.packagingType].filter(Boolean).join(' · ')||'No pack details')}</small></div><div>${badge(v.verificationStatus)} ${badge(v.publicationStatus)}</div></div><div class="variant-body"><h3>Identifiers</h3>${table(['identifierValue','identifierType','isPrimary','verificationStatus','status'],v.identifiers,row=>`<button class="secondary" onclick="copyText('${escapeHtml(row.identifierValue)}')">Copy</button>`)}</div></div>`}
async function publishProduct(id){try{await server('publishNcpcProduct',id,'Published from NCPC interface');notify('Product published');closeModal();renderActive()}catch(e){notify(e.message,true)}}
async function withdrawProduct(id){if(!confirm('Withdraw this product from the published catalogue?'))return;try{await server('withdrawNcpcProduct',id,'Withdrawn from NCPC interface');notify('Product withdrawn');closeModal();renderActive()}catch(e){notify(e.message,true)}}
function copyText(text){navigator.clipboard?.writeText(text);notify('Copied')}

async function openProductEditor(productId){await refreshReference();let existing=null;if(productId)existing=await server('getNcpcProduct',productId);const p=existing?.product||{};const variants=existing?.variants?.length?existing.variants:[{variantName:'',sizeValue:'',sizeUnit:'',salesUnit:'',packagingType:'',inventoryType:'piece_based',identifiers:[]}];openModal(productId?'Edit product':'Create product',`<form id="productForm"><div class="form-grid"><label>Catalogue domain<small>Broad catalogue area</small><select name="catalogueDomainId" required>${options(state.reference.catalogueDomains,p.catalogueDomainId)}</select></label><label>Category<small>Controlled product classification</small><select name="categoryId" required>${options(state.reference.categories,p.categoryId)}</select></label><label>Brand<select name="brandId">${options(state.reference.brands,p.brandId,'name','No brand')}</select></label><label>Product type<input name="productType" value="${escapeHtml(p.productType||'packaged')}"></label><label class="full">Canonical product name<input name="canonicalName" required value="${escapeHtml(p.canonicalName||'')}"></label><label class="full">Description<textarea name="description">${escapeHtml(p.description||'')}</textarea></label><label>Quality tier<select name="qualityTier">${selectOptions(state.bootstrap.enums.evidenceTiers.concat(['manually_created']),p.qualityTier||'manually_created')}</select></label><label>Verification<select name="verificationStatus">${selectOptions(state.bootstrap.enums.verificationStatuses,p.verificationStatus||'unverified')}</select></label><label>Publication<select name="publicationStatus">${selectOptions(state.bootstrap.enums.publicationStatuses,p.publicationStatus||'draft')}</select></label><label>Status<select name="status">${selectOptions(['active','inactive','archived'],p.status||'active')}</select></label><label class="full">Aliases<small>One alternative name per line</small><textarea name="aliases">${escapeHtml((existing?.aliases||[]).map(x=>x.alias).join('\n'))}</textarea></label></div><h3 style="margin-top:18px">Variants</h3><div id="variantEditor">${variants.map((v,i)=>variantEditor(v,i)).join('')}</div><button type="button" class="secondary" onclick="addVariantEditor()">+ Add variant</button></form>`,productId?`<button onclick="saveProduct('${productId}')">Save changes</button>`:`<button onclick="saveProduct('')">Create product</button>`)}
function variantEditor(v,i){const identifiers=(v.identifiers||[]).map(x=>[x.identifierValue,x.identifierType,x.verificationStatus].join(' | ')).join('\n');return `<div class="variant" data-variant-index="${i}"><div class="variant-body"><div class="toolbar"><h3>Variant ${i+1}</h3>${i?`<button type="button" class="danger" onclick="this.closest('.variant').remove()">Remove</button>`:''}</div><input type="hidden" name="variantId" value="${escapeHtml(v.id||'')}"><div class="form-grid"><label>Variant name<input name="variantName" required value="${escapeHtml(v.variantName||'')}"></label><label>Packaging type<input name="packagingType" value="${escapeHtml(v.packagingType||'')}"></label><label>Size value<input name="sizeValue" type="number" step="any" value="${escapeHtml(v.sizeValue||'')}"></label><label>Size unit<input name="sizeUnit" value="${escapeHtml(v.sizeUnit||'')}"></label><label>Sales unit<input name="salesUnit" value="${escapeHtml(v.salesUnit||'')}"></label><label>Inventory type<select name="inventoryType">${selectOptions(['piece_based','weight_based','volume_based'],v.inventoryType||'piece_based')}</select></label><label class="full">Identifiers<small>One per line: value | type | verification</small><textarea name="identifiers">${escapeHtml(identifiers)}</textarea></label></div></div></div>`}
function addVariantEditor(){const holder=document.createElement('div');holder.innerHTML=variantEditor({},document.querySelectorAll('#variantEditor .variant').length);variantEditorEl.appendChild(holder.firstElementChild)}
async function saveProduct(id){try{const form=document.getElementById('productForm');const base=Object.fromEntries(new FormData(form));const variants=[...document.querySelectorAll('#variantEditor .variant')].map(card=>({id:card.querySelector('[name=variantId]').value||undefined,variantName:card.querySelector('[name=variantName]').value,sizeValue:card.querySelector('[name=sizeValue]').value,sizeUnit:card.querySelector('[name=sizeUnit]').value,salesUnit:card.querySelector('[name=salesUnit]').value,packagingType:card.querySelector('[name=packagingType]').value,inventoryType:card.querySelector('[name=inventoryType]').value,verificationStatus:base.verificationStatus,publicationStatus:base.publicationStatus,status:'active',identifiers:card.querySelector('[name=identifiers]').value.split('\n').map(x=>x.trim()).filter(Boolean).map(line=>{const [identifierValue,identifierType,verificationStatus]=line.split('|').map(x=>x.trim());return{identifierValue,identifierType:identifierType||'EAN13',verificationStatus:verificationStatus||'unverified'}})}));const bundle={id:id||undefined,catalogueDomainId:base.catalogueDomainId,categoryId:base.categoryId,brandId:base.brandId,canonicalName:base.canonicalName,description:base.description,productType:base.productType,qualityTier:base.qualityTier,verificationStatus:base.verificationStatus,publicationStatus:base.publicationStatus,status:base.status,aliases:base.aliases.split('\n').map(x=>x.trim()).filter(Boolean),variants};await server('saveNcpcProductBundle',bundle);notify(id?'Product updated':'Product created');closeModal();await refreshBootstrap();navigate('catalogue')}catch(e){notify(e.message,true)}}

async function renderReviews(){const rows=await server('getNcpcReviewQueue',{});reviews.innerHTML=`<div class="section-head"><div><h1>Review Queue</h1><p class="sub">Product identity, publication, market confirmation and barcode governance decisions.</p></div><button class="secondary" onclick="renderReviews()">Refresh</button></div><div class="panel"><div class="filters"><select id="reviewStatus" onchange="filterReviewTable()">${selectOptions(['pending','in_progress','waiting_for_information','resolved'],'pending','All statuses')}</select><select id="reviewType" onchange="filterReviewTable()">${selectOptions([...new Set(rows.map(x=>x.queueType))],'','All review types')}</select><select id="reviewPriority" onchange="filterReviewTable()">${selectOptions(state.bootstrap.enums.priorities,'','All priorities')}</select></div><div id="reviewTable" data-rows="${escapeHtml(JSON.stringify(rows))}"></div></div>`;filterReviewTable()}
function filterReviewTable(){const all=JSON.parse(document.getElementById('reviewTable').dataset.rows||'[]');const status=document.getElementById('reviewStatus').value,type=document.getElementById('reviewType').value,priority=document.getElementById('reviewPriority').value;const filtered=all.filter(x=>(!status||x.status===status)&&(!type||x.queueType===type)&&(!priority||x.priority===priority));reviewTable.innerHTML=table(['queueType','entityType','entityId','priority','reason','status','createdAt'],filtered,row=>`<button onclick="openReview('${row.id}')">Review</button>`) }
async function openReview(id){const data=await server('getNcpcReviewContext',id);const r=data.review,e=data.entity;let preview='';if(data.productContext)preview=`<h3>Product context</h3><div class="detail-grid">${detail('Name',data.productContext.product.canonicalName)}${detail('Quality',badge(data.productContext.product.qualityTier),true)}${detail('Verification',badge(data.productContext.product.verificationStatus),true)}${detail('Publication',badge(data.productContext.product.publicationStatus),true)}</div>`;else if(e)preview=`<h3>Candidate</h3><div class="detail-grid">${detail('Name',e.rawName)}${detail('Origin',e.originReference)}${detail('Status',badge(e.status),true)}</div><details style="margin-top:12px"><summary>Raw research record</summary><div class="code">${escapeHtml(JSON.stringify(e.parsedPayload||{},null,2))}</div></details>`;const choices=r.entityType==='ProductCandidates'?`<button onclick="resolveReview('${r.id}','promote_candidate')">Promote to draft</button><button class="secondary" onclick="resolveReview('${r.id}','request_information')">Need information</button><button class="danger" onclick="resolveReview('${r.id}','reject')">Reject</button>`:`<button onclick="resolveReview('${r.id}','approve_identity')">Approve identity</button><button onclick="resolveReview('${r.id}','publish')">Publish</button><button class="secondary" onclick="resolveReview('${r.id}','request_information')">Need information</button><button class="danger" onclick="resolveReview('${r.id}','reject')">Reject</button>`;openModal(label(r.queueType),`<div class="notice warn">${escapeHtml(r.reason)}</div>${preview}<label style="margin-top:16px">Review notes<textarea id="reviewNotes"></textarea></label>`,choices)}
async function resolveReview(id,resolution){try{await server('resolveNcpcReview',id,resolution,document.getElementById('reviewNotes')?.value||'');notify('Review resolved');closeModal();renderReviews();await refreshBootstrap()}catch(e){notify(e.message,true)}}

async function renderBarcodes(){const queue=await server('listNcpcRecords','BarcodeVerificationQueue',{});barcodes.innerHTML=`<div class="section-head"><div><h1>Barcode Verification</h1><p class="sub">No barcode becomes a trusted identifier until physical or authoritative evidence confirms it.</p></div><button onclick="openBarcodeSubmission()">Submit barcode</button></div><div class="panel">${table(['identifierValue','identifierType','variantId','submissionSource','status','submittedBy','createdAt'],queue,row=>row.status==='pending'?`<button onclick="openBarcodeDecision('${row.id}','${escapeHtml(row.identifierValue)}')">Verify</button>`:'')}</div>`}
function openBarcodeSubmission(){openModal('Submit barcode for verification',`<form id="barcodeForm"><div class="form-grid"><label>Variant ID<small>Open a product to find its variant ID</small><input name="variantId" required></label><label>Identifier value<input name="identifierValue" required></label><label>Identifier type<select name="identifierType">${selectOptions(['EAN13','EAN8','UPC','GTIN14','CODE128'],'EAN13')}</select></label><label>Submission source<select name="submissionSource">${selectOptions(['physical_scan','product_label','manufacturer_source','distributor_source','manual_entry'],'physical_scan')}</select></label><label class="full">Product photo URL<input name="photoUrl" type="url"></label><label class="full">Information source ID<input name="sourceId"></label></div></form>`,`<button onclick="submitBarcode()">Submit for review</button>`)}
async function submitBarcode(){try{const data=Object.fromEntries(new FormData(document.getElementById('barcodeForm')));await server('submitBarcodeForVerification',data);notify('Barcode submitted');closeModal();renderBarcodes()}catch(e){notify(e.message,true)}}
function openBarcodeDecision(id,value){openModal('Verify '+value,`<div class="notice warn">Confirm this identifier against the physical label, GS1 record, manufacturer or authorized distributor.</div><label style="margin-top:14px">Verification notes<textarea id="barcodeNotes"></textarea></label>`,`<button onclick="resolveBarcode('${id}','verify')">Verify barcode</button><button class="danger" onclick="resolveBarcode('${id}','reject')">Reject</button>`)}
async function resolveBarcode(id,decision){try{await server('resolveBarcodeVerification',id,decision,document.getElementById('barcodeNotes').value);notify('Barcode decision saved');closeModal();renderBarcodes();await refreshBootstrap()}catch(e){notify(e.message,true)}}

async function renderImports(){const jobs=await server('listNcpcRecords','ImportJobs',{});imports.innerHTML=`<div class="section-head"><div><h1>Import Management</h1><p class="sub">Validate, queue and process large NCPC research manifests in resumable batches.</p></div><button class="secondary" onclick="renderImports()">Refresh</button></div><div class="split"><div><div class="panel"><h2>New research import</h2><div class="dropzone" id="dropzone"><b>Select an NCPC research manifest</b><p class="sub">Supported schema: <code>apps-script-research-import-v1</code></p><input type="file" id="manifestFile" accept="application/json,.json" onchange="loadManifestFile(this.files[0])"></div><div id="manifestPreview"></div></div><div class="panel"><h2>Safe import policy</h2><div class="notice good">Official exact and institution-linked records become draft products. Market pack-size hypotheses enter Product Candidates and Review Queue instead of the published catalogue.</div></div></div><div><div class="panel"><h2>Import controls</h2><div id="activeImport">${state.currentImportJob?renderActiveImport(state.currentImportJob):'<div class="empty">No active import in this browser.</div>'}</div></div></div></div><div class="panel"><h2>Import history</h2>${renderImportJobs(jobs.slice().reverse())}</div>`;wireDropzone()}
function wireDropzone(){const dz=document.getElementById('dropzone');if(!dz)return;['dragenter','dragover'].forEach(evt=>dz.addEventListener(evt,e=>{e.preventDefault();dz.classList.add('drag')}));['dragleave','drop'].forEach(evt=>dz.addEventListener(evt,e=>{e.preventDefault();dz.classList.remove('drag')}));dz.addEventListener('drop',e=>loadManifestFile(e.dataTransfer.files[0]))}
async function loadManifestFile(file){if(!file)return;try{const text=await file.text();const manifest=JSON.parse(text);if(manifest.schemaVersion!=='apps-script-research-import-v1')throw new Error('Unsupported schema: '+manifest.schemaVersion);if(!Array.isArray(manifest.bundles))throw new Error('The manifest has no bundles array.');state.manifest=manifest;state.manifestFileName=file.name;const tiers={};manifest.bundles.forEach(b=>{const tier=b.research?.institutionExpansion?.evidenceTier||(b.product?.verificationStatus==='reviewed'?'official_exact':'institution_linked_family');tiers[tier]=(tiers[tier]||0)+1});manifestPreview.innerHTML=`<div class="manifest-preview"><div class="preview-item"><b>${manifest.bundles.length}</b>Products/candidates</div><div class="preview-item"><b>${manifest.sources?.length||0}</b>Information sources</div>${Object.entries(tiers).map(([k,v])=>`<div class="preview-item"><b>${v}</b>${escapeHtml(label(k))}</div>`).join('')}</div><div class="notice warn" style="margin-top:12px">Manifest: ${escapeHtml(manifest.manifestId||file.name)}. Records are queued first and then processed in resumable batches.</div><div class="actions" style="margin-top:12px"><button onclick="startManifestImport()">Start import</button><button class="secondary" onclick="state.manifest=null;manifestPreview.innerHTML=''">Clear</button></div>`}catch(e){notify(e.message,true)}}
async function startManifestImport(){if(!state.manifest||state.importRunning)return;state.importRunning=true;try{const manifest=state.manifest;let job=await server('createNcpcImportJob',{manifestId:manifest.manifestId||'',schemaVersion:manifest.schemaVersion,fileName:state.manifestFileName,marketCode:(manifest.market?.countryCode||manifest.market?.code||(typeof manifest.market==='string'?manifest.market:'ZM')),totalItems:manifest.bundles.length},manifest.sources||[]);state.currentImportJob=job;renderActiveImportPanel();const chunkSize=20;for(let i=0;i<manifest.bundles.length;i+=chunkSize){const response=await server('appendNcpcImportItems',job.id,i,manifest.bundles.slice(i,i+chunkSize));job=response.job;state.currentImportJob=job;renderActiveImportPanel()}await runImportProcessing(job.id)}catch(e){notify(e.message,true)}finally{state.importRunning=false}}
async function runImportProcessing(jobId){state.importRunning=true;try{let complete=false;while(!complete){const response=await server('processNcpcImportBatch',jobId,10);state.currentImportJob=response.job;renderActiveImportPanel();complete=['completed','completed_with_errors','cancelled'].includes(response.job.status);if(!complete&&response.processedThisBatch===0)break}if(complete){notify('Import processing completed');await refreshBootstrap();renderImports()}}catch(e){notify(e.message,true)}finally{state.importRunning=false}}
function renderActiveImportPanel(){const target=document.getElementById('activeImport');if(target)target.innerHTML=renderActiveImport(state.currentImportJob)}
function renderActiveImport(job){return `<div class="import-job"><div class="import-job-head"><div><b>${escapeHtml(job.fileName)}</b><br><small>${escapeHtml(job.id)} · ${escapeHtml(job.manifestId||'No manifest ID')}</small></div>${badge(job.status)}</div><div class="job-stats"><span>Queued: ${job.queuedItems}/${job.totalItems}</span><span>Processed: ${job.processedItems}</span><span>Created: ${job.createdItems}</span><span>Merged: ${job.mergedItems}</span><span>Candidates: ${job.candidateItems}</span><span>Failed: ${job.failedItems}</span></div><div class="progress"><span style="width:${Number(job.progressPercent||0)}%"></span></div><div class="progress-label"><span>${escapeHtml(label(job.currentStage))}</span><b>${job.progressPercent||0}%</b></div><div class="actions" style="margin-top:12px">${!['completed','completed_with_errors','cancelled'].includes(job.status)?`<button onclick="runImportProcessing('${job.id}')">Resume processing</button><button class="secondary" onclick="pauseImport('${job.id}')">Pause</button><button class="danger" onclick="cancelImport('${job.id}')">Cancel</button>`:''}${Number(job.failedItems)>0?`<button class="warning" onclick="retryImport('${job.id}')">Retry failed</button>`:''}</div>${job.errorSummary?`<div class="notice warn" style="margin-top:10px">${escapeHtml(job.errorSummary)}</div>`:''}</div>`}
function renderImportJobs(jobs){if(!jobs?.length)return '<div class="empty">No import jobs yet.</div>';return jobs.map(job=>`<div class="import-job"><div class="import-job-head"><div><b>${escapeHtml(job.fileName||job.manifestId)}</b><br><small>${escapeHtml(job.id)} · ${dateText(job.createdAt)}</small></div>${badge(job.status)}</div><div class="progress"><span style="width:${Number(job.progressPercent||0)}%"></span></div><div class="job-stats"><span>${job.processedItems}/${job.totalItems} processed</span><span>${job.createdItems} created</span><span>${job.mergedItems} merged</span><span>${job.candidateItems} candidates</span><span>${job.failedItems} failed</span></div>${!['completed','completed_with_errors','cancelled'].includes(job.status)?`<button class="secondary" onclick="openImportJob('${job.id}')">Open</button>`:''}</div>`).join('')}
async function openImportJob(id){const jobs=await server('listNcpcRecords','ImportJobs',{});state.currentImportJob=jobs.find(x=>x.id===id)||null;await navigate('imports')}
async function pauseImport(id){try{state.currentImportJob=await server('pauseNcpcImportJob',id);renderActiveImportPanel();notify('Import paused')}catch(e){notify(e.message,true)}}
async function cancelImport(id){if(!confirm('Cancel this import job? Imported records will remain.'))return;try{state.currentImportJob=await server('cancelNcpcImportJob',id);renderActiveImportPanel();notify('Import cancelled')}catch(e){notify(e.message,true)}}
async function retryImport(id){try{await server('retryFailedNcpcImportItems',id);notify('Failed items re-queued');runImportProcessing(id)}catch(e){notify(e.message,true)}}

async function renderOrganizations(){const [orgRows,roles]=await Promise.all([server('listNcpcRecords','Organizations',{}),server('listNcpcRecords','OrganizationRoles',{})]);const grouped={};roles.forEach(r=>(grouped[r.organizationId]??=[]).push(r.roleType));orgRows.forEach(o=>o.roleSummary=(grouped[o.id]||[]).map(label).join(', '));document.getElementById('organizations').innerHTML=`<div class="section-head"><div><h1>Organizations</h1><p class="sub">Companies, authorities and commercial entities connected to brands, products and evidence.</p></div><button onclick="openOrganizationEditor()">+ Organization</button></div><div class="panel">${table(['legalName','tradingName','countryCode','roleSummary','verificationStatus','status','updatedAt'],orgRows,row=>`<button class="secondary" onclick="openOrganizationEditor('${row.id}')">Edit</button>`)}</div>`}
async function openOrganizationEditor(id){const [orgs,roles]=await Promise.all([server('listNcpcRecords','Organizations',{}),server('listNcpcRecords','OrganizationRoles',{})]);const o=orgs.find(x=>x.id===id)||{};const selected=roles.filter(x=>x.organizationId===id).map(x=>x.roleType);openModal(id?'Edit organization':'Create organization',`<form id="organizationForm"><div class="form-grid"><label>Legal name<input name="legalName" required value="${escapeHtml(o.legalName||'')}"></label><label>Trading name<input name="tradingName" value="${escapeHtml(o.tradingName||'')}"></label><label>Country code<input name="countryCode" value="${escapeHtml(o.countryCode||'ZM')}"></label><label>Website URL<input name="websiteUrl" type="url" value="${escapeHtml(o.websiteUrl||'')}"></label><label>Verification<select name="verificationStatus">${selectOptions(state.bootstrap.enums.verificationStatuses,o.verificationStatus||'unverified')}</select></label><label>Status<select name="status">${selectOptions(['active','inactive'],o.status||'active')}</select></label><label class="full">Organization roles<small>Select all applicable roles</small><div class="grid">${state.bootstrap.enums.organizationRoles.map(role=>`<label class="detail-item"><input style="width:auto" type="checkbox" name="roles" value="${role}" ${selected.includes(role)?'checked':''}> ${escapeHtml(label(role))}</label>`).join('')}</div></label><label class="full">Description<textarea name="description">${escapeHtml(o.description||'')}</textarea></label></div></form>`,`<button onclick="saveOrganization('${id||''}')">Save organization</button>`)}
async function saveOrganization(id){try{const form=document.getElementById('organizationForm'),fd=new FormData(form),data=Object.fromEntries(fd);data.id=id||undefined;data.roles=fd.getAll('roles').map(roleType=>({roleType,territoryCode:data.countryCode||'ZM',verificationStatus:data.verificationStatus,status:'active'}));await server('saveNcpcOrganization',data);notify('Organization saved');closeModal();await refreshBootstrap();renderOrganizations()}catch(e){notify(e.message,true)}}

async function renderReferences(){const tabs=['CatalogueDomains','Categories','Brands'];const tableName=state.referenceTab;const rows=await server('listNcpcRecords',tableName,{});references.innerHTML=`<div class="section-head"><div><h1>Reference Data</h1><p class="sub">Controlled catalogue domains, categories and brand identities.</p></div><button onclick="openReferenceEditor('${tableName}')">+ ${escapeHtml(label(tableName.replace(/s$/,'')))}</button></div><div class="tabs">${tabs.map(t=>`<button class="${t===tableName?'active':''}" onclick="state.referenceTab='${t}';renderReferences()">${label(t)}</button>`).join('')}</div><div class="panel">${table(referenceColumns(tableName),rows,row=>`<button class="secondary" onclick="openReferenceEditor('${tableName}','${row.id}')">Edit</button>`)}</div>`}
function referenceColumns(name){if(name==='CatalogueDomains')return['name','description','status','updatedAt'];if(name==='Categories')return['name','catalogueDomainId','parentCategoryId','description','status'];return['name','description','verificationStatus','status','updatedAt']}
async function openReferenceEditor(tableName,id){const rows=await server('listNcpcRecords',tableName,{}),r=rows.find(x=>x.id===id)||{};let fields='';if(tableName==='CatalogueDomains')fields=`<label>Name<input name="name" required value="${escapeHtml(r.name||'')}"></label>`;if(tableName==='Categories')fields=`<label>Catalogue domain<select name="catalogueDomainId" required>${options(state.reference.catalogueDomains,r.catalogueDomainId)}</select></label><label>Parent category<select name="parentCategoryId">${options(state.reference.categories,r.parentCategoryId,'name','No parent')}</select></label><label>Name<input name="name" required value="${escapeHtml(r.name||'')}"></label>`;if(tableName==='Brands')fields=`<label>Name<input name="name" required value="${escapeHtml(r.name||'')}"></label><label>Verification<select name="verificationStatus">${selectOptions(state.bootstrap.enums.verificationStatuses,r.verificationStatus||'unverified')}</select></label>`;openModal((id?'Edit ':'Create ')+label(tableName.replace(/s$/,'')),`<form id="referenceForm"><div class="form-grid">${fields}<label>Status<select name="status">${selectOptions(['active','inactive'],r.status||'active')}</select></label><label class="full">Description<textarea name="description">${escapeHtml(r.description||'')}</textarea></label></div></form>`,`<button onclick="saveReference('${tableName}','${id||''}')">Save</button>`)}
async function saveReference(tableName,id){try{const data=Object.fromEntries(new FormData(document.getElementById('referenceForm')));if(id)await server('updateNcpcRecord',tableName,id,data);else await server('createNcpcRecord',tableName,data);notify('Reference record saved');closeModal();await refreshBootstrap();renderReferences()}catch(e){notify(e.message,true)}}

async function renderEvidence(){const tabs=['InformationSources','CatalogueEvidence'];const t=state.evidenceTab;const rows=await server('listNcpcRecords',t,{});evidence.innerHTML=`<div class="section-head"><div><h1>Sources & Evidence</h1><p class="sub">Trace every important catalogue claim back to its information source.</p></div><button onclick="${t==='InformationSources'?'openSourceEditor()':'openEvidenceEditor()'}">+ ${t==='InformationSources'?'Source':'Evidence'}</button></div><div class="tabs">${tabs.map(x=>`<button class="${x===t?'active':''}" onclick="state.evidenceTab='${x}';renderEvidence()">${label(x)}</button>`).join('')}</div><div class="panel">${table(t==='InformationSources'?['title','sourceType','authority','url','status','updatedAt']:['productId','variantId','claimType','claimValue','evidenceTier','confidence','verificationStatus','sourceId'],rows,t==='InformationSources'?row=>`<button class="secondary" onclick="openSourceEditor('${row.id}')">Edit</button>`:null)}</div>`}
async function openSourceEditor(id){const rows=await server('listNcpcRecords','InformationSources',{}),s=rows.find(x=>x.id===id)||{};openModal(id?'Edit information source':'Create information source',`<form id="sourceForm"><div class="form-grid"><label>External source ID<input name="externalSourceId" value="${escapeHtml(s.externalSourceId||'')}"></label><label>Title<input name="title" required value="${escapeHtml(s.title||'')}"></label><label>URL<input name="url" type="url" value="${escapeHtml(s.url||'')}"></label><label>Source type<input name="sourceType" value="${escapeHtml(s.sourceType||'manufacturer_official')}"></label><label>Authority<select name="authority">${selectOptions(['official','authoritative','primary_shop_record','trusted_secondary','unverified'],s.authority||'unverified')}</select></label><label>Organization<select name="organizationId">${options(state.reference.organizations,s.organizationId,'tradingName','No organization')}</select></label><label>Document date<input type="date" name="documentDate" value="${escapeHtml(s.documentDate||'')}"></label><label>Status<select name="status">${selectOptions(['active','inactive'],s.status||'active')}</select></label><label class="full">Notes<textarea name="notes">${escapeHtml(s.notes||'')}</textarea></label></div></form>`,`<button onclick="saveSource('${id||''}')">Save source</button>`)}
async function saveSource(id){try{const data=Object.fromEntries(new FormData(document.getElementById('sourceForm')));data.id=id||undefined;await server('saveNcpcSource',data);notify('Information source saved');closeModal();await refreshBootstrap();renderEvidence()}catch(e){notify(e.message,true)}}
async function openEvidenceEditor(productId=''){await refreshReference();openModal('Add catalogue evidence',`<form id="evidenceForm"><div class="form-grid"><label>Product ID<input name="productId" required value="${escapeHtml(productId)}"></label><label>Variant ID<input name="variantId"></label><label>Information source<select name="sourceId">${options(state.reference.informationSources,'','title','No source')}</select></label><label>Claim type<input name="claimType" required placeholder="canonical_name, pack_size, manufacturer…"></label><label class="full">Claim value<textarea name="claimValue"></textarea></label><label>Evidence tier<select name="evidenceTier">${selectOptions(state.bootstrap.enums.evidenceTiers,'official_exact')}</select></label><label>Confidence<select name="confidence">${selectOptions(['unknown','low','medium','high'],'medium')}</select></label><label>Verification<select name="verificationStatus">${selectOptions(state.bootstrap.enums.verificationStatuses,'unverified')}</select></label><label class="full">Review notes<textarea name="reviewNotes"></textarea></label></div></form>`,`<button onclick="saveEvidence()">Add evidence</button>`)}
async function saveEvidence(){try{const data=Object.fromEntries(new FormData(document.getElementById('evidenceForm')));await server('addNcpcEvidence',data);notify('Evidence added');closeModal();if(state.active==='evidence')renderEvidence()}catch(e){notify(e.message,true)}}

async function openProductRelationshipEditor(productId,variantId=''){await refreshReference();openModal('Link organization to product',`<form id="productRelationshipForm"><div class="form-grid"><label>Product ID<input name="productId" value="${escapeHtml(productId)}" required></label><label>Variant ID<input name="variantId" value="${escapeHtml(variantId)}"></label><label>Organization<select name="organizationId" required>${options(state.reference.organizations,'','tradingName')}</select></label><label>Relationship type<select name="relationshipType">${selectOptions(state.bootstrap.enums.organizationRelationships,'manufactured_by')}</select></label><label>Territory code<input name="territoryCode" value="ZM"></label><label>Information source<select name="sourceId">${options(state.reference.informationSources,'','title','No source')}</select></label><label>Verification<select name="verificationStatus">${selectOptions(state.bootstrap.enums.verificationStatuses,'unverified')}</select></label><input type="hidden" name="status" value="active"></div></form>`,`<button onclick="saveProductRelationship()">Save relationship</button>`)}
async function saveProductRelationship(){try{const data=Object.fromEntries(new FormData(document.getElementById('productRelationshipForm')));await server('createNcpcRecord','ProductOrganizationRelationships',data);notify('Organization relationship saved');closeModal()}catch(e){notify(e.message,true)}}
async function openDigitalAssetEditor(productId,variantId=''){await refreshReference();openModal('Add digital asset',`<form id="digitalAssetForm"><div class="form-grid"><label>Product ID<input name="productId" required value="${escapeHtml(productId)}"></label><label>Variant ID<input name="variantId" value="${escapeHtml(variantId)}"></label><label>Asset type<select name="assetType">${selectOptions(['image','video','document','label_scan'],'image')}</select></label><label>Source URL<input name="sourceUrl" type="url" required></label><label>Storage URL<input name="storageUrl" type="url"></label><label>Information source<select name="sourceId">${options(state.reference.informationSources,'','title','No source')}</select></label><label>Verification<select name="verificationStatus">${selectOptions(state.bootstrap.enums.verificationStatuses,'unverified')}</select></label><label>Status<select name="status">${selectOptions(['active','inactive'],'active')}</select></label><label class="full">Caption<textarea name="caption"></textarea></label></div></form>`,`<button onclick="saveDigitalAsset()">Save asset</button>`)}
async function saveDigitalAsset(){try{const data=Object.fromEntries(new FormData(document.getElementById('digitalAssetForm')));await server('createNcpcRecord','DigitalAssets',data);notify('Digital asset saved');closeModal()}catch(e){notify(e.message,true)}}

async function renderReleases(){const releasesData=await server('listNcpcRecords','CatalogueReleases',{});releases.innerHTML=`<div class="section-head"><div><h1>Catalogue Releases</h1><p class="sub">Immutable snapshots of products and variants approved for downstream use.</p></div><div class="actions"><button class="secondary" onclick="downloadCatalogue(false)">Export full draft</button><button class="secondary" onclick="downloadCatalogue(true)">Export published</button><button onclick="openReleaseEditor()">Create release</button></div></div><div class="panel">${table(['releaseName','releaseVersion','status','productCount','variantCount','publishedAt','publishedBy'],releasesData.slice().reverse())}</div>`}
function openReleaseEditor(){openModal('Create catalogue release',`<form id="releaseForm"><div class="form-grid"><label>Release name<input name="releaseName" required></label><label class="full">Description<textarea name="description"></textarea></label></div></form>`,`<button onclick="createRelease()">Publish release</button>`)}
async function createRelease(){try{const data=Object.fromEntries(new FormData(document.getElementById('releaseForm')));const release=await server('createNcpcRelease',data.releaseName,data.description);notify('Release created: '+release.releaseVersion);closeModal();renderReleases()}catch(e){notify(e.message,true)}}
async function downloadCatalogue(publishedOnly){try{const data=await server('exportNcpcCatalogue',{publishedOnly});const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`ncpc-${publishedOnly?'published':'full'}-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),500);notify('Catalogue JSON prepared')}catch(e){notify(e.message,true)}}

async function renderAudit(){const rows=await server('listNcpcRecords','AuditEvents',{});audit.innerHTML=`<div class="section-head"><div><h1>Audit Trail</h1><p class="sub">Who changed what, when, and why.</p></div><button class="secondary" onclick="renderAudit()">Refresh</button></div><div class="panel">${table(['timestamp','userEmail','action','entityType','entityId','notes'],rows.slice().reverse().slice(0,500),row=>`<button class="secondary" onclick="showAudit('${row.id}')">Details</button>`)}</div>`}
async function showAudit(id){const rows=await server('listNcpcRecords','AuditEvents',{}),r=rows.find(x=>x.id===id);openModal('Audit event '+id,`<div class="detail-grid">${detail('Action',r.action)}${detail('Entity',r.entityType)}${detail('Entity ID',r.entityId)}${detail('User',r.userEmail)}${detail('Time',dateText(r.timestamp),true)}</div><h3 style="margin-top:15px">Notes</h3><p>${escapeHtml(r.notes||'')}</p><h3>Previous value</h3><div class="code">${escapeHtml(formatJson(r.oldValue))}</div><h3 style="margin-top:12px">New value</h3><div class="code">${escapeHtml(formatJson(r.newValue))}</div>`,``)}
function formatJson(value){try{return JSON.stringify(JSON.parse(value),null,2)}catch{return value||''}}

async function renderSettings(){const settingsData=await server('listNcpcRecords','SystemSettings',{});const db=state.bootstrap.database;settings.innerHTML=`<div class="section-head"><div><h1>System Administration</h1><p class="sub">NCPC database identity, schema, runtime settings and initialization.</p></div><button onclick="reinitialize()">Verify database structure</button></div><div class="grid"><div class="card"><h3>Database</h3><p><b>${escapeHtml(db.name)}</b></p><p class="sub">${escapeHtml(db.id)}</p><button class="secondary" onclick="openDatabase()">Open spreadsheet</button></div><div class="card"><h3>Application</h3><p><b>${escapeHtml(state.bootstrap.application.version)}</b></p><p class="sub">Schema ${escapeHtml(state.bootstrap.application.schemaVersion)}</p></div><div class="card"><h3>Integration state</h3><p><b>Standalone</b></p><p class="sub">No TradeFlow or bot connector is enabled.</p></div></div><div class="panel"><h2>System settings</h2>${table(['key','value','description','updatedAt'],settingsData)}</div><div class="panel"><h2>Database tables</h2><p class="sub">The database initializer creates all intended NCPC tables and columns automatically in a completely empty spreadsheet.</p><div class="notice good">Products, ProductVariants, Identifiers, Organizations, OrganizationRoles, Brands, relationships, InformationSources, CatalogueEvidence, candidates, review queues, imports, releases, settings, sequences and audit tables are included.</div></div>`}
async function reinitialize(){try{const result=await server('initializeNcpcSystem');notify(result.alreadyInitialized?'Database structure is ready':'Database initialized');await refreshBootstrap();renderSettings()}catch(e){notify(e.message,true)}}

function openModal(title,body,footer=''){modalTitle.textContent=title;modalBody.innerHTML=body;modalFoot.innerHTML=footer;modalBackdrop.classList.add('open');window.variantEditorEl=document.getElementById('variantEditor')}
function closeModal(){modalBackdrop.classList.remove('open');modalBody.innerHTML='';modalFoot.innerHTML=''}
modalBackdrop.addEventListener('click',event=>{if(event.target===modalBackdrop)closeModal()});
globalSearch.addEventListener('keydown',event=>{if(event.key==='Enter'){state.catalogue.query=event.target.value;state.catalogue.page=1;navigate('catalogue')}});

async function start(){buildNav();try{await refreshBootstrap();await renderDashboard()}catch(e){dashboard.innerHTML=`<div class="panel"><h1>NCPC could not start</h1><p>${escapeHtml(e.message)}</p><button onclick="start()">Retry</button></div>`;notify(e.message,true)}}
document.addEventListener('DOMContentLoaded',start);
</script>
</body>
</html>
